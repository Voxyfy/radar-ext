<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0b0c10; --panel:#13151b; --line:#232630; --text:#e8e9ee; --muted:#8a8f9c; --green:#3ddc84; --red:#ff5d6c; --amber:#ffb547; }
  body { width: 300px; margin: 0; padding: 14px; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, system-ui, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 15px; }
  .target { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .target .l { color: var(--muted); font-size: 11px; }
  .target .u { font-weight: 600; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; cursor: pointer; }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.warn { border-color: var(--amber); color: var(--amber); }
  .msg { margin-top: 10px; color: var(--muted); min-height: 18px; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); } .msg.warn { color: var(--amber); }
  .foot { margin-top: 12px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <h1 data-i18n="panelTitle"></h1>
  <div class="target">
    <div class="l"><span data-i18n="popupTarget"></span> · <span data-i18n="popupLast"></span>: <span id="last"></span></div>
    <div class="u" id="user">—</div>
  </div>
  <div class="row">
    <button id="take" class="primary" data-i18n="popupTake"></button>
    <button id="panel" data-i18n="popupOpenPanel"></button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="foot" data-i18n="footerPrivacy"></div>
  <script src="popup.js"></script>
</body>
</html>
